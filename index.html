<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question and Answer Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <header class="mb-4 text-center">
        <h1 class="display-5 fw-bold">Your Title Here</h1>
        <p class="lead text-secondary">A simple question and answer template</p>
      </header>

      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <section class="card h-100 shadow-sm">
            <div class="card-body">
              <h2 class="h4 card-title">Question 1</h2>
              <p class="card-text">Write your first question here.</p>
              <hr />
              <h3 class="h5">Answer</h3>
              <p class="card-text text-secondary">
                Write the answer to the first question here.
              </p>
            </div>
          </section>
        </div>

        <div class="col-12 col-lg-6">
          <section class="card h-100 shadow-sm">
            <div class="card-body">
              <h2 class="h4 card-title">Question 2</h2>
              <p class="card-text">Write your second question here.</p>
              <hr />
              <h3 class="h5">Answer</h3>
              <p class="card-text text-secondary">
                Write the answer to the second question here.
              </p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
